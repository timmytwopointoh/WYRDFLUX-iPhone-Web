<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta charset="utf-8"><title>Elysium Pocket</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#101711">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#101711;color:#eee;font:15px system-ui;overscroll-behavior:none}body{display:flex;flex-direction:column}header,nav{display:flex;align-items:center;gap:6px;padding:6px max(6px,env(safe-area-inset-right)) 6px max(6px,env(safe-area-inset-left));background:#233027;flex-wrap:wrap}header{justify-content:space-between}button,input{font:inherit;border:1px solid #75816b;background:#344438;color:white;border-radius:8px;padding:10px;min-height:42px}button:active{background:#64754f}#end{background:#633d2d}#map{min-height:0;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;background:#090d09}#frame{max-height:100%;max-width:100%;object-fit:contain;touch-action:none;user-select:none;-webkit-user-drag:none}#pair{margin:auto;padding:20px;max-width:420px}#pair input{width:100%;margin:8px 0}#game{display:none;flex:1;min-height:0;flex-direction:column}#status{font-size:13px}nav{justify-content:center}button{white-space:nowrap}#context.active{background:#a07838}
</style></head><body>
<section id="pair"><h2>Elysium Pocket</h2><p>Enter your 8-character player code.</p><details id="setup"><summary>PC connection setup (once)</summary><input id="pc" type="url" autocomplete="off" autocapitalize="off" placeholder="PC Tailscale HTTPS address"></details><input id="code" type="text" autocomplete="off" autocapitalize="characters" maxlength="8" spellcheck="false" placeholder="8-character code"><button id="join">Connect</button><p id="error"></p><p id="androidSetup" hidden><a id="androidLink" style="color:#d9bd76">Open Android app with this PC saved</a></p></section>
<section id="game"><header><strong id="seat"></strong><span id="status">Connecting…</span><button id="leave">Disconnect</button></header><div id="map"><img id="frame" draggable="false" alt="Game stream"></div><nav>
<button data-key="j">◀ Commander</button><button data-key="n">Commander ▶</button><button data-key="r">Recruit</button><button data-key="t">Transfer</button><button data-key="p">Power</button><button data-key="l">Trade</button><button data-key="PageUp">Zoom +</button><button data-key="PageDown">Zoom −</button><button id="context">Inspect</button><button data-key="Escape">Back</button><button id="end">End turn</button>
</nav></section>
<script>
if(location.protocol==='https:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
let base='', token='', running=false, generation=0, inspect=false, tail=Promise.resolve(), lastTap=null, points=new Map(), gesture=null, frameURL='';
const $=id=>document.getElementById(id), img=$('frame');
const saved=new URLSearchParams(location.hash.slice(1)).get('pc')||new URLSearchParams(location.search).get('pc')||localStorage.getItem('elysium-pc')||'';
$('pc').value=saved;try{if(saved){base=serverAddress();localStorage.setItem('elysium-pc',base);$('setup').style.display='none';}else $('setup').open=true;}catch{$('setup').open=true;}
if(saved&&/Android/i.test(navigator.userAgent)){try{const u=new URL(saved.startsWith('https://')?saved:'https://'+saved);if(/^([a-z0-9-]+\.)+ts\.net$/i.test(u.hostname)){$('androidLink').href='elysiumpocket://connect?pc='+encodeURIComponent(u.hostname);$('androidSetup').hidden=false;}}catch{}}
function serverAddress(){let h=$('pc').value.trim();if(!h.startsWith('https://'))h='https://'+h;let u=new URL(h);if(u.protocol!=='https:'||!/^([a-z0-9-]+\.)+ts\.net$/i.test(u.hostname)||u.username||u.password||u.search||u.hash||(u.port&&u.port!=='8443')||(u.pathname!=='/'&&u.pathname!=='/play'))throw Error('Enter your PC Tailscale HTTPS hostname');return 'https://'+u.hostname+':8443';}
async function api(path,body){const r=await fetch(base+path,{method:body===undefined?'GET':'POST',cache:'no-store',headers:{'Authorization':'Bearer '+token,...(body===undefined?{}:{'Content-Type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)})});if(!r.ok)throw Error('Request failed '+r.status);return r;}
function send(v){const g=generation;tail=tail.catch(()=>{}).then(async()=>{if(running&&g===generation)await api('/input',v)}).catch(()=>{$('status').textContent='Input failed';});return tail;}
function key(k){return send({kind:'key',key:k});}
function pos(x,y){let r=img.getBoundingClientRect();if(!img.naturalWidth||r.width<=0||r.height<=0||x<r.left||x>r.right||y<r.top||y>r.bottom)return null;return{x:(x-r.left)/r.width,y:(y-r.top)/r.height};}
function click(kind,x,y){let p=pos(x,y);if(p)send({kind,...p});}
function pan(dx,dy){let k=Math.abs(dx)>Math.abs(dy)?(dx>0?'ArrowLeft':'ArrowRight'):(dy>0?'ArrowUp':'ArrowDown');key(k);}
function stop(){running=false;generation++;points.clear();if(gesture)clearTimeout(gesture.timer);gesture=null;if(frameURL){URL.revokeObjectURL(frameURL);frameURL='';}img.removeAttribute('src');$('pair').style.display='block';$('game').style.display='none';}
$('join').onclick=async()=>{try{base=serverAddress();localStorage.setItem('elysium-pc',base);const code=$('code').value.trim().toUpperCase();if(!/^[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{8}$/.test(code))throw Error('Enter all 8 characters');const r=await api('/join',{code});const j=await r.json();token=j.token;running=true;generation++;$('seat').textContent='Player '+j.player;$('pair').style.display='none';$('game').style.display='flex';$('code').value='';frames(generation);}catch(e){$('error').textContent=e.message+'. Check the PC launcher and Tailscale connection.';if(!base){$('setup').style.display='block';$('setup').open=true;}}};
$('leave').onclick=async()=>{try{await api('/leave',{})}catch{}stop();token='';};
async function frames(g){while(running&&g===generation){try{let r=await api('/frame');let b=await r.blob();if(g!==generation)return;let url=URL.createObjectURL(b);let old=frameURL;frameURL=url;img.src=url;if(old)URL.revokeObjectURL(old);$('status').textContent='Connected';}catch(e){$('status').textContent='Waiting for game view';}await new Promise(r=>setTimeout(r,100));}}
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key));
$('end').onclick=()=>{if(confirm('End your turn?'))key('y');};
$('context').onclick=()=>{inspect=!inspect;$('context').classList.toggle('active',inspect);};
img.oncontextmenu=e=>e.preventDefault();
img.onpointerdown=e=>{if(!pos(e.clientX,e.clientY))return;e.preventDefault();img.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===1){gesture={id:e.pointerId,x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,moved:false,fired:false,pinch:false};let g=gesture;g.timer=setTimeout(()=>{if(gesture===g&&!g.moved&&!g.pinch){g.fired=true;click('right',g.x,g.y);}},550);}else if(points.size===2&&gesture){clearTimeout(gesture.timer);gesture.pinch=true;const a=[...points.values()];gesture.dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}};
img.onpointermove=e=>{if(!points.has(e.pointerId)||!gesture)return;e.preventDefault();points.set(e.pointerId,{x:e.clientX,y:e.clientY});let g=gesture;if(points.size===2){const a=[...points.values()];let d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(Math.abs(d-g.dist)>34){key(d>g.dist?'PageUp':'PageDown');g.dist=d;}return;}if(g.pinch||g.fired)return;if(Math.hypot(e.clientX-g.x,e.clientY-g.y)>14){clearTimeout(g.timer);g.moved=true;}let dx=e.clientX-g.px,dy=e.clientY-g.py;if(g.moved&&Math.hypot(dx,dy)>55){pan(dx,dy);g.px=e.clientX;g.py=e.clientY;}};
img.onpointerup=e=>{if(!points.has(e.pointerId))return;points.delete(e.pointerId);let g=gesture;if(!g)return;clearTimeout(g.timer);if(!g.moved&&!g.pinch&&!g.fired){if(inspect){click('right',e.clientX,e.clientY);inspect=false;$('context').classList.remove('active');}else{let now=performance.now(),p=pos(e.clientX,e.clientY);if(p){let dbl=lastTap&&now-lastTap.time<300&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<22;click(dbl?'double':'left',e.clientX,e.clientY);lastTap=dbl?null:{time:now,x:e.clientX,y:e.clientY};}}}if(!points.size)gesture=null;};
img.onpointercancel=e=>{points.delete(e.pointerId);if(gesture)clearTimeout(gesture.timer);gesture=null;};
</script></body></html>
