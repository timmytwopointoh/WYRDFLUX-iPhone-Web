function createDepthRenderer(canvas){

function parseDepthPacket(buf){

let predicting=true,playing=false,lastFrameArrival=0,lastFrameStamp=0,lastStatusAt=0,serverAmmo=0,localAmmo=0,serverDown=false,waiting=true,localReady=false,faceChoice=0;
let predictedYaw=0,predictedPitch=0,aimSeeded=false,aimSamples=[],localYaw=0,localPitch=0,localShot=0,flashAt=-1e9,recoilAt=-1e9,animationId=0,renderX=0,renderY=0,renderZoom=1,renderAt=0;

function visualLoop(now){animationId=0;if(!playing)return;const dt=renderAt?Math.min(.05,(now-renderAt)/1000):.016;renderAt=now;
 const fresh=lastFrameArrival>0&&now-lastFrameArrival<700&&now-lastStatusAt<1200&&!waiting&&!serverDown&&now-inputAck<1000;

const gateway='https://miss-princesses-masterpiece-maker.tailbe4401.ts.net';
function timeout(ms){const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal}
async function discover(){const matches=await Promise.all([8443,10000,443].map(async p=>{const url=gateway+(p===443?'':':'+p);try{const r=await fetch(url+'/health',{cache:'no-store',signal:timeout(4500)});const j=await r.json();return r.ok&&j.service==='grave-app-test'&&j.seat===3?{url,j}:null}catch{return null}}));const found=matches.filter(Boolean);if(found.length!==1)throw Error(found.length?'More than one GRAVETHROE host is active. Close the extra session.':'PC game server offline or not updated. Start GRAVETHROE and wait for the pairing code.');const host=found[0];const start=Date.now();const r=await fetch(host.url+'/health',{cache:'no-store',signal:timeout(3500)});const health=await r.json();clockOffset=Number.isFinite(health.server_ms)?health.server_ms-(start+Date.now())/2:0;timedVideo=health.timed_video===1;depthEnabled=health.depth_v1===1;depthStream=health.depth_stream===1;absoluteAim=health.aim_absolute===1;return host.url}
function layoutState(playing){if(window.parent!==window)window.parent.postMessage({type:'gravethroe-player3-layout',playing},location.origin)}
async function req(path,body){return fetch(base+path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)}),cache:'no-store',signal:timeout(path==="/input"?1500:3500)})}

function stop(message){playing=false;cancelAnimationFrame(animationId);predictionReset();layoutState(false);generation++;if(streamAbort)streamAbort.abort();streamAbort=null;token='';zero();$('join').style.display='grid';$('controls').style.display='none';$('msg').textContent=message||'';if(frameUrl)URL.revokeObjectURL(frameUrl);frameUrl='';$('video').removeAttribute('src')}
$('connect').onclick=async()=>{if($('connect').disabled)return;$('connect').disabled=true;try{const code=$('code').value.trim();if(!/^\d{8}$/.test(code))throw Error('Enter exactly 8 digits.');$('msg').textContent='Finding PC game host…';base=await discover();const r=await req('/join',{code});const j=await r.json();if(!r.ok)throw Error(j.error);token=j.token;predictionReset();zero();playing=true;animationId=requestAnimationFrame(visualLoop);$('join').style.display='none';$('controls').style.display='block';layoutState(true);const g=++generation;inputs(g);startVideo(g);status(g)}catch(e){$('msg').textContent=e.message}finally{$('connect').disabled=false}};
const pause=ms=>new Promise(r=>setTimeout(r,ms));
let inputAck=0,lastInputRtt=0,controllerSeq=0,pumpInput=null;
async function inputs(g){
 let pending=0,lastSend=0,lastSignature='';

  const now=performance.now(),state=wireState(),signature=JSON.stringify(state);
  if(pending<4&&(signature!==lastSignature||now-lastSend>=33)){
   lastSend=now;lastSignature=signature;pending++;

   // Bounded pipeline: new state can overtake old requests; host discards stale sequences.
   req('/input',body).then(r=>{
    if(g!==generation)return;
    if(r.status===403){stop('Seat expired. Rejoin.');return}
    if(r.ok){inputAck=performance.now();lastInputRtt=Math.round(inputAck-start)}
   }).catch(()=>{}).finally(()=>pending--);
  }

 while(token&&g===generation){pump();await pause(8)}
 if(pumpInput===pump)pumpInput=null;
}

let queued=null,decoding=false;
function display(bytes,g,stamp=0){queued={bytes,g,stamp};if(!decoding)decodeLatest()}
async function decodeLatest(){
 decoding=true;
 try{while(queued){const q=queued;queued=null;if(q.g!==generation)continue;
 const u=URL.createObjectURL(q.bytes instanceof Blob?q.bytes:new Blob([q.bytes],{type:'image/jpeg'}));
 const im=new Image();im.src=u;
 try{await im.decode();if(q.g!==generation){URL.revokeObjectURL(u);continue}

 const t=performance.now();if(t-lastFpsTime>=1000){fps=Math.round(displayed*1000/(t-lastFpsTime));displayed=0;lastFpsTime=t}
 $('state').textContent=fps+' FPS';}catch{URL.revokeObjectURL(u)}
 }}finally{decoding=false;if(queued)decodeLatest()}
}
let depthQueued=null,depthDecoding=false;

async function decodeDepthLatest(){
 depthDecoding=true;try{while(depthQueued){const q=depthQueued;depthQueued=null;if(q.g!==generation)continue;
 let url='';try{const p=parseDepthPacket(q.data);if(p.stamp<=lastFrameStamp&&depthMode)continue;

 if(q.g!==generation){URL.revokeObjectURL(url);continue}
 depthRenderer.upload(im,p.depth);depthMeta=p.meta;depthMode=true;lastFrameArrival=performance.now();lastFrameStamp=p.stamp;
 $('video').src=url;if(frameUrl)URL.revokeObjectURL(frameUrl);frameUrl=url;url='';
 displayed++;if(lastFrameArrival-lastFpsTime>=1000){fps=Math.round(displayed*1000/(lastFrameArrival-lastFpsTime));displayed=0;lastFpsTime=lastFrameArrival}
 $('state').textContent=fps+' FPS | DEPTH';
 }catch{if(url)URL.revokeObjectURL(url)}
 }}finally{depthDecoding=false;if(depthQueued)decodeDepthLatest()}

async function depthContinuous(g){
 const abort=new AbortController();streamAbort=abort;let watchdog=setTimeout(()=>abort.abort(),4500);let started=false,lastGood=performance.now();
 try{const r=await fetch(base+'/depth-stream',{headers:{Authorization:'Bearer '+token},cache:'no-store',signal:abort.signal});
 if(r.status===403){stop('Seat expired. Rejoin.');return}if(!r.ok||!r.body)throw Error('Depth stream unavailable');

 while(token&&g===generation){const {value,done}=await reader.read();if(done)break;

}
async function startVideo(g){
 displayed=0;fps=0;lastFpsTime=performance.now();
 if(depthEnabled){try{if(!depthRenderer)depthRenderer=createDepthRenderer($('depthCanvas'));
 if(depthRenderer&&depthStream){try{await depthContinuous(g)}catch{}}

 }catch{}}

}
async function frames(g){

 if(r.status===403){stop('Seat expired. Rejoin.');return}if(!r.ok||!r.body)throw Error('Streaming unavailable');
 const reader=r.body.getReader();let pending=new Uint8Array(0);
 while(token&&g===generation){const {value,done}=await reader.read();if(done)break;
