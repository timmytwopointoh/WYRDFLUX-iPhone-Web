<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WYRDFLUX">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>WYRDFLUX</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0d14;overscroll-behavior:none;touch-action:none}
#safe{position:fixed;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);overflow:hidden}
#game{position:absolute;top:50%;left:50%;display:block;border:0;max-width:none;max-height:none;transform-origin:50% 50%;background:#0c0d14}
#install{position:fixed;z-index:3;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);width:360px;box-sizing:border-box;background:#11131bee;border:1px solid #a98543;color:#eee;font:12px/1.4 system-ui,sans-serif;padding:9px 32px 9px 12px;border-radius:8px;box-shadow:0 2px 16px #0008}
#install[hidden]{display:none}#close{position:absolute;right:5px;top:4px;background:transparent;border:0;color:#fff;font:22px system-ui;padding:2px 7px;touch-action:manipulation}
</style>
</head>
<body>
<div id="safe"><iframe id="game" title="WYRDFLUX game" src="./game.html" allow="autoplay; fullscreen; gamepad" allowfullscreen scrolling="no"></iframe></div>
<div id="install" hidden>For full-screen iPhone play without Safari controls: Share → Add to Home Screen → open the WYRDFLUX icon.<button id="close" aria-label="Dismiss installation tip">×</button></div>
<script>
(function(){
'use strict';
const safe=document.getElementById('safe'),game=document.getElementById('game');
const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function layout(){
 const w=Math.max(1,safe.clientWidth),h=Math.max(1,safe.clientHeight);
 const rotate=h>w&&(ios||navigator.maxTouchPoints>0);
 game.style.width=(rotate?h:w)+'px';
 game.style.height=(rotate?w:h)+'px';
 game.style.transform='translate(-50%,-50%)'+(rotate?' rotate(90deg)':'');
 document.documentElement.dataset.landscape=rotate?'rotated':'native';
}
function standalone(){return navigator.standalone===true||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches}
layout();window.addEventListener('resize',layout);window.addEventListener('orientationchange',()=>{layout();setTimeout(layout,250);setTimeout(layout,700)});
if(window.visualViewport)visualViewport.addEventListener('resize',layout);
if(window.ResizeObserver)new ResizeObserver(layout).observe(safe);
let dismissed=false;try{dismissed=sessionStorage.getItem('wyrdflux-install-tip')==='1'}catch(e){}
const tip=document.getElementById('install');
tip.hidden=!ios||standalone()||dismissed;
document.getElementById('close').onclick=()=>{tip.hidden=true;try{sessionStorage.setItem('wyrdflux-install-tip','1')}catch(e){}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(console.warn);
})();
</script>
</body>
</html>
